name: Build GLASS CUSTOMIZER APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4

      - name: Skonfiguruj JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Skonfiguruj Android SDK
        uses: android-actions/setup-android@v3

      - name: Zainstaluj Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Skonfiguruj Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Rozpakuj projekt, jeśli w repo jest tylko archiwum
        shell: bash
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f GLASS-CUSTOMIZER-Android-Studio.zip ]; then
            unzip -oq GLASS-CUSTOMIZER-Android-Studio.zip -d .
          fi
          test -f settings.gradle.kts
          test -f gradlew
          chmod +x gradlew

      - name: Zbuduj APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Udostępnij APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: glass-customizer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
